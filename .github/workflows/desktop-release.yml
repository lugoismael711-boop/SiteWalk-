name: Build desktop installers

# Builds the SiteWalk desktop app (Electron) into a Windows .exe installer and
# a macOS .dmg on GitHub's native runners (they can't be built on Linux).
#   • Run manually (Actions → "Build desktop installers" → Run workflow) to get
#     downloadable artifacts.
#   • Push a tag like v1.0.0 to also publish them to a GitHub Release.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build installer
        run: npm run dist:${{ matrix.platform }}
        env:
          # Unsigned build (no Apple/Windows certificate). The app still
          # installs; users click through the OS "unidentified developer"
          # warning once. Add signing certs later to remove it.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sitewalk-${{ matrix.platform }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.blockmap
          if-no-files-found: warn

      - name: Publish to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
          fail_on_unmatched_files: false
